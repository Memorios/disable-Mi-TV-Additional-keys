name: Build Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1

      - name: Set up stable toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc

      - name: Add MSVC target components (if missing)
        run: rustup component add rustfmt clippy

      - name: cargo build release
        run: cargo build --release

      - name: List artifact
        run: dir target\release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disable-Mi-TV-Additional-keys-windows
          path: target/release/disable-Mi-TV-Additional-keys.exe
